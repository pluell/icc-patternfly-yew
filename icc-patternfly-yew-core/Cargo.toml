[package]
name = "icc-patternfly-yew-core"
version = "0.1.0"
authors = ["Patrick Luell <pluell@iccdesigns.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
derive_more = { version = "2.0.1", features = ["from"] }
getrandom = { version = "0.2", features = ["js"] }
gloo = "0.11.0"
icc-patternfly-yew-icons = { path = "../icc-patternfly-yew-icons" }
log.workspace = true
rand = "0.8"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DomRect", "Event", "HtmlCollection", "NodeList", "Window"] }
yew.workspace = true